name: Build iOS App (Simulator)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FocusTimer.xcodeproj \
            -scheme FocusTimer \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app for Appetize.io
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r FocusTimer.app.zip FocusTimer.app

      - uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/FocusTimer.app.zip

      - name: Publish latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Build/Products/Debug-iphonesimulator/FocusTimer.app.zip \
            --title "Latest build (iOS Simulator)" \
            --notes "Automatically built from the latest commit on main. Unzip and drop FocusTimer.app onto appetize.io/upload to test in a browser." \
            --latest
