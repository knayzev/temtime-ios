name: Build iOS App (Simulator)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FocusTimer.xcodeproj \
            -scheme FocusTimer \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app for Appetize.io
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r FocusTimer.app.zip FocusTimer.app

      - uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/FocusTimer.app.zip
