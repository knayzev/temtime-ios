name: FocusTimer
options:
  bundleIdPrefix: com.knayzev
  deploymentTarget:
    iOS: "16.0"
targets:
  FocusTimer:
    type: application
    platform: iOS
    sources:
      - path: FocusTimer
    info:
      path: FocusTimer/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: EPV
        # XcodeGen writes these two as the constants "1.0" and "1" unless told otherwise, and App Store
        # Connect refuses a build number it has already seen. Tied to the build settings, CI can
        # number each upload by its run.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: Используется для подсчёта шагов в разделе «Настройки».
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knayzev.epv
        PRODUCT_NAME: FocusTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
